<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snake Dodge</title>
<style>
  :root {
    --bg: #14161b; --panel: #1e2129; --ink: #e9ecf1; --mut: #8a93a3;
    --snake: #5ee07a; --head: #a6f5b5; --bad: #ff5a4e; --obst: #ffb838; --wall: #3a4050;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  /* The rickroll video sits behind the whole game and shows once the red button is pressed */
  .bgvid { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    opacity: 0; visibility: hidden; transition: opacity .6s; background: #000; }
  .bgvid iframe { position: absolute; top: 50%; left: 50%; border: 0;
    width: max(100vw, 177.78vh); height: max(100vh, 56.25vw); transform: translate(-50%, -50%); }
  body.rolling { background: #000; }
  body.rolling .bgvid { opacity: 1; visibility: visible; }
  body.rolling .hud, body.rolling .help { text-shadow: 0 1px 4px #000, 0 0 2px #000; }
  body.rolling .hud .k, body.rolling .help, body.rolling a { color: #e9ecf1; }
  .app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 12px 16px; gap: 10px; }
  .hud { display: flex; gap: 22px; align-items: baseline; font-variant-numeric: tabular-nums; }
  .hud .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); }
  .hud b { font-size: 24px; display: block; }
  @keyframes blink { 50% { opacity: .2; } }
  canvas { display: block; border-radius: 6px; }
  .controls { display: grid; grid-template-columns: repeat(3, 72px); grid-template-rows: 46px 46px; gap: 6px; }
  .controls button { border-radius: 10px; border: 2px solid var(--wall); padding: 0;
    background: var(--panel); color: var(--ink); font: 700 20px/1 system-ui, sans-serif; cursor: pointer; }
  .controls button small { display: block; font-size: 10px; font-weight: 500; color: var(--mut); letter-spacing: .06em; margin-top: 3px; }
  .controls [data-k="0"] { grid-column: 2; grid-row: 1; }
  .controls [data-k="3"] { grid-column: 1; grid-row: 2; }
  .controls [data-k="2"] { grid-column: 2; grid-row: 2; }
  .controls [data-k="1"] { grid-column: 3; grid-row: 2; }
  .controls button.forbidden { background: var(--bad); border-color: #ff8a80; color: #fff;
    box-shadow: 0 0 18px rgba(255, 90, 78, .55); }
  .controls button.forbidden small { color: #fff; }
  .controls button.forbidden.warn { animation: blink .3s steps(2) infinite; }
  .controls button:active { transform: translateY(1px); }
  .help { font-size: 12px; color: var(--mut); }
  a { color: var(--mut); }
</style>
</head>
<body>
<div class="bgvid" aria-hidden="true">
  <iframe id="rickvid" title="Background video" tabindex="-1" allow="autoplay; encrypted-media"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1&controls=0&disablekb=1&loop=1&playlist=dQw4w9WgXcQ&modestbranding=1&playsinline=1&rel=0&iv_load_policy=3"></iframe>
</div>
<div class="app">
  <div class="hud">
    <div><span class="k">Score</span><b id="score">0</b></div>
    <div><span class="k">Best</span><b id="best">0</b></div>
    <div><span class="k">Length</span><b id="len">0</b></div>
  </div>
  <canvas id="c"></canvas>
  <div class="controls">
    <button data-k="0" aria-label="Up">W<small>↑</small></button>
    <button data-k="3" aria-label="Left">A<small>←</small></button>
    <button data-k="2" aria-label="Down">S<small>↓</small></button>
    <button data-k="1" aria-label="Right">D<small>→</small></button>
  </div>
  <div class="help">W A S D or arrow keys to steer · P to pause · <a href="instructions.html">instructions</a></div>
</div>
<script>
(() => {
  // ---- Tunables (we will iterate on these) ----
  const COLS = 19, ROWS = 23;
  const START_LEN = 4;
  const GROW_PENALTY = 3;      // segments added when pressing the forbidden side
  const MOVE_TIME = 0.14;      // seconds per snake step
  const SWAP_MIN = 10, SWAP_MAX = 22; // seconds before the forbidden key changes (random in range)
  const SWAP_WARN = 2;         // seconds of warning before it changes
  const RB_SPEED = 1.6;        // red button speed, cells/second (it homes in on the head)
  const RB_REACH = 3;        // how close the head must get before the arm presses it
  const RB_LIFE = 14;          // seconds before an unpressed red button fades away
  const RB_EVERY = () => 5 + Math.random() * 6; // seconds until the next red button
  // Arm timeline (seconds into the 'arm' state): reach out, wind up high, SLAM, then let the impact ring out.
  const T_REACH = 0.45, T_WIND = 0.75, T_SLAM = 0.83, ARM_TIME = 1.5;
  const RICK_TIME = 2;         // freeze with the banner before play resumes on top of the video
  const HIT_PAUSE = 1.2;       // freeze after a hit

  // Directions (also the key ids): 0 up/W, 1 right/D, 2 down/S, 3 left/A.
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const KEYS = ['W', 'D', 'S', 'A'];

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best'), lenEl = $('len');
  const btns = [...document.querySelectorAll('.controls button')];

  let best = 0;
  try { best = +localStorage.getItem('snakeDodgeBest') || 0; } catch (e) {}

  let snake, dir, turns, grow, obstacles, score, state, moveAcc, spawnAcc, elapsed;
  let forbidden = Math.floor(Math.random() * 4), swapTimer = 0;
  let hitTimer = 0, penaltyFlash = 0, hitMsg = '';
  let rb = null, rbTimer = 0, armT = 0, rickT = 0, sparks = [];
  const swapIn = () => SWAP_MIN + Math.random() * (SWAP_MAX - SWAP_MIN);
  function newForbidden() {
    let k; do k = Math.floor(Math.random() * 4); while (k === forbidden);
    forbidden = k; swapTimer = swapIn();
  }

  function reset() {
    const y = Math.floor(ROWS * 0.65), x = Math.floor(COLS / 2) - 1;
    snake = [];
    for (let i = 0; i < START_LEN; i++) snake.push({ x: x - i + 1, y });
    dir = 1; turns = []; grow = 0; obstacles = [];
    score = 0; moveAcc = 0; spawnAcc = 0.6; elapsed = 0;
    swapTimer = swapIn();
    rb = null; rbTimer = 3 + Math.random() * 3;
    state = 'ready';
  }

  // ---- Rickroll video (YouTube embed, driven by YouTube's iframe API) ----
  let rolling = false, player = null;
  const vid = document.getElementById('rickvid');
  window.onYouTubeIframeAPIReady = () => { player = new YT.Player('rickvid'); };
  const api = document.createElement('script');
  api.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(api);
  function startRoll() {
    rolling = true; document.body.classList.add('rolling');
    if (player && player.playVideo) {
      try {
        player.seekTo(0, true); player.unMute(); player.setVolume(80); player.playVideo();
        // browsers may refuse to start a video with sound: then play it muted
        setTimeout(() => {
          if (rolling && ![1, 3].includes(player.getPlayerState())) { player.mute(); player.playVideo(); }
        }, 1200);
      } catch (e) {}
    } else if (!vid.src.includes('autoplay=1')) vid.src += '&autoplay=1'; // API not loaded: autoplay the embed
  }
  function stopRoll() {
    if (!rolling) return;
    rolling = false; document.body.classList.remove('rolling');
    try { if (player && player.pauseVideo) player.pauseVideo(); else vid.src = vid.src.replace('&autoplay=1', ''); } catch (e) {}
  }

  // ---- Sound ----
  let actx = null;
  function beep(freq, dur = 0.08, type = 'square', vol = 0.06) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // A heavy slam: a low pitch drop plus a burst of noise.
  function thud() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.35);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.45);
      const len = Math.floor(actx.sampleRate * 0.25), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      const n = actx.createBufferSource(), f = actx.createBiquadFilter(), ng = actx.createGain();
      n.buffer = buf; f.type = 'lowpass'; f.frequency.value = 1400; ng.gain.value = 0.5;
      n.connect(f).connect(ng).connect(actx.destination); n.start(t);
    } catch (e) {}
  }

  // ---- Input ----
  function press(k) {
    if (state === 'ready' || state === 'paused') { state = 'playing'; return; }
    if (state !== 'playing') return;
    if (k === forbidden) {
      grow += GROW_PENALTY; penaltyFlash = 0.35;
      beep(140, 0.18, 'sawtooth', 0.08);
      return; // the forbidden key only punishes, it does not steer
    }
    beep(520, 0.03, 'square', 0.03);
    const lastDir = turns.length ? turns[turns.length - 1] : dir;
    if (k !== lastDir && k !== (lastDir + 2) % 4 && turns.length < 2) turns.push(k);
  }
  const KEYMAP = { w: 0, arrowup: 0, d: 1, arrowright: 1, s: 2, arrowdown: 2, a: 3, arrowleft: 3 };
  addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k in KEYMAP) { press(KEYMAP[k]); e.preventDefault(); }
    else if (k === 'p' || k === 'escape') { if (state === 'playing') state = 'paused'; else if (state === 'paused') state = 'playing'; }
    else if ((k === ' ' || k === 'enter') && (state === 'ready' || state === 'paused')) { state = 'playing'; e.preventDefault(); }
  });
  for (const b of btns) b.addEventListener('pointerdown', e => { e.preventDefault(); press(+b.dataset.k); });
  cv.addEventListener('pointerdown', e => {
    // tap on the board: steer toward the tap, relative to the head
    e.preventDefault();
    const r = cv.getBoundingClientRect(), h = snake[0];
    const dx = e.clientX - r.left - pad - (h.x + 0.5) * cell, dy = e.clientY - r.top - pad - (h.y + 0.5) * cell;
    press(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  });
  addEventListener('blur', () => { if (state === 'playing') state = 'paused'; });

  // ---- Game logic ----
  function hit(msg) {
    stopRoll(); // getting hit ends the rickroll
    hitMsg = msg; state = 'hit'; hitTimer = HIT_PAUSE;
    beep(90, 0.4, 'sawtooth', 0.1);
  }

  function step() {
    if (turns.length) dir = turns.shift();
    // no walls: leaving one side brings you back on the opposite side
    const h = snake[0], nx = (h.x + DIRS[dir][0] + COLS) % COLS, ny = (h.y + DIRS[dir][1] + ROWS) % ROWS;
    const body = grow > 0 ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === nx && s.y === ny)) return hit('Bit yourself');
    snake.unshift({ x: nx, y: ny });
    if (grow > 0) grow--; else snake.pop();
  }

  function difficulty() { return Math.min(1, elapsed / 90); }

  function spawn() {
    const d = difficulty();
    const w = 1 + Math.floor(Math.random() * (1 + d * 3));
    obstacles.push({
      x: Math.floor(Math.random() * (COLS - w + 1)), y: -1, w,
      v: 2.5 + d * 4 + Math.random() * 1.5,
    });
  }

  function overlapsSnake(o) {
    const m = 0.15; // a little forgiveness
    return snake.some(s => o.x + m < s.x + 1 && o.x + o.w - m > s.x && o.y + m < s.y + 1 && o.y + 1 - m > s.y);
  }

  // The red button drifts toward the head. Get close and the snake grows an arm and presses it.
  function updateRedButton(dt) {
    if (!rb) {
      if (rolling) return; // no new red button while the video plays
      rbTimer -= dt;
      if (rbTimer <= 0) rb = { x: 1 + Math.random() * (COLS - 2), y: -0.5, life: RB_LIFE };
      return;
    }
    const h = snake[0], hx = h.x + 0.5, hy = h.y + 0.5;
    const dx = hx - rb.x, dy = hy - rb.y, d = Math.hypot(dx, dy);
    if (d < RB_REACH) { state = 'arm'; armT = 0; beep(300, 0.1, 'triangle', 0.08); return; }
    rb.x += dx / d * RB_SPEED * dt; rb.y += dy / d * RB_SPEED * dt;
    rb.life -= dt;
    if (rb.life <= 0) { rb = null; rbTimer = RB_EVERY(); }
  }

  function impact() {
    thud();
    beep(1400, 0.05, 'square', 0.05);
    sparks = [];
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, v = 6 + Math.random() * 12;
      sparks.push({ x: rb.x, y: rb.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.3 + Math.random() * 0.4,
        c: ['#fff', '#ffd23f', '#ff3b30', '#ff8a3d'][i % 4] });
    }
  }

  function update(dt) {
    if (penaltyFlash > 0) penaltyFlash -= dt;
    if (state === 'hit') {
      hitTimer -= dt;
      if (hitTimer <= 0) reset();
      return;
    }
    if (state === 'arm') {
      const before = armT;
      armT += dt;
      if (before < T_SLAM && armT >= T_SLAM) impact();
      for (const p of sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; p.life -= dt; }
      sparks = sparks.filter(p => p.life > 0);
      if (armT >= ARM_TIME) { state = 'rick'; rickT = 0; rb = null; sparks = []; rbTimer = RB_EVERY(); cv.style.transform = ''; startRoll(); }
      return;
    }
    if (state === 'rick') {
      rickT += dt;
      if (rickT >= RICK_TIME) { state = 'playing'; moveAcc = 0; }
      return;
    }
    if (state !== 'playing') return;

    elapsed += dt;
    swapTimer -= dt;
    if (swapTimer <= 0) { newForbidden(); beep(880, 0.12, 'triangle', 0.08); }

    moveAcc += dt;
    while (moveAcc >= MOVE_TIME && state === 'playing') { moveAcc -= MOVE_TIME; step(); }
    if (state !== 'playing') return;

    spawnAcc -= dt;
    if (spawnAcc <= 0) { spawn(); spawnAcc = 1.1 - difficulty() * 0.75 + Math.random() * 0.3; }

    updateRedButton(dt);
    if (state !== 'playing') return;

    for (const o of obstacles) o.y += o.v * dt;
    for (const o of obstacles) if (overlapsSnake(o)) return hit('Hit by an obstacle');
    const before = obstacles.length;
    obstacles = obstacles.filter(o => o.y < ROWS);
    const dodged = before - obstacles.length;
    if (dodged) {
      score += dodged;
      if (score > best) { best = score; try { localStorage.setItem('snakeDodgeBest', best); } catch (e) {} }
    }
  }

  // ---- Rendering ----
  let cell = 20, pad = 6;
  function resize() {
    const availW = innerWidth - 24, availH = innerHeight - 220;
    cell = Math.max(10, Math.floor(Math.min(availW / COLS, availH / ROWS)));
    const w = COLS * cell + pad * 2, h = ROWS * cell + pad * 2, dpr = devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);

  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }

  function draw() {
    const W = COLS * cell, H = ROWS * cell;
    ctx.clearRect(0, 0, W + pad * 2, H + pad * 2);
    // border; while rickrolled the board is see-through so the video shows behind it
    ctx.fillStyle = state === 'hit' ? '#7a2620' : '#3a4050';
    rr(0, 0, W + pad * 2, H + pad * 2, 6);
    ctx.clearRect(pad, pad, W, H);
    ctx.fillStyle = rolling ? 'rgba(23,26,33,.35)' : '#171a21';
    ctx.fillRect(pad, pad, W, H);

    ctx.save();
    ctx.translate(pad, pad);
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

    // grid
    ctx.fillStyle = rolling ? 'rgba(255,255,255,.04)' : '#1d2129';
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) if ((x + y) % 2) ctx.fillRect(x * cell, y * cell, cell, cell);

    // obstacles
    for (const o of obstacles) {
      ctx.fillStyle = '#ffb838';
      rr(o.x * cell + 1, o.y * cell + 1, o.w * cell - 2, cell - 2, 3);
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.fillRect(o.x * cell + 3, o.y * cell + cell * 0.65, o.w * cell - 6, 2);
    }

    // red button
    if (rb) {
      const pressed = state === 'arm' && armT >= T_SLAM;
      const fade = Math.min(1, rb.life / 1.5), pulse = state === 'arm' ? 1 : 1 + Math.sin(performance.now() / 120) * 0.08;
      const bx = rb.x * cell, by = rb.y * cell, R = cell * 0.7 * pulse;
      ctx.globalAlpha = fade;
      ctx.fillStyle = 'rgba(255,60,50,.25)';
      ctx.beginPath(); ctx.arc(bx, by, R * 1.6, 0, 7); ctx.fill();
      ctx.fillStyle = '#2b2f38';
      ctx.beginPath(); ctx.arc(bx, by + cell * 0.12, R, 0, 7); ctx.fill();
      ctx.fillStyle = pressed ? '#a8201a' : '#ff3b30';
      ctx.beginPath();
      if (pressed) ctx.ellipse(bx, by + cell * 0.08, R * 0.85, R * 0.6, 0, 0, 7); // squashed flat
      else ctx.arc(bx, by - cell * 0.12, R * 0.75, 0, 7);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.beginPath(); ctx.arc(bx - R * 0.25, by - R * 0.35, R * 0.18, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // snake
    const flash = penaltyFlash > 0 && Math.floor(penaltyFlash * 20) % 2 === 0;
    snake.forEach((s, i) => {
      const t = i / Math.max(1, snake.length - 1);
      ctx.fillStyle = flash || state === 'hit' ? '#ff5a4e' : i === 0 ? '#a6f5b5' : `hsl(135, 65%, ${58 - t * 22}%)`;
      const inset = i === 0 ? 1 : 2;
      rr(s.x * cell + inset, s.y * cell + inset, cell - inset * 2, cell - inset * 2, i === 0 ? cell * 0.35 : cell * 0.25);
    });
    // eyes
    const h = snake[0], [dx, dy] = DIRS[dir];
    const cx = h.x * cell + cell / 2, cy = h.y * cell + cell / 2;
    ctx.fillStyle = '#14161b';
    for (const sgn of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(cx + dx * cell * 0.18 + -dy * sgn * cell * 0.2, cy + dy * cell * 0.18 + dx * sgn * cell * 0.2, Math.max(1.5, cell * 0.08), 0, 7);
      ctx.fill();
    }
    // the arm and hand that slam the red button
    if (state === 'arm' && rb) drawArm(cx, cy);
    ctx.restore();

    // screen shake right after the slam
    const ti = state === 'arm' ? armT - T_SLAM : -1;
    if (ti >= 0 && ti < 0.45) {
      const a = cell * 0.5 * (1 - ti / 0.45);
      cv.style.transform = `translate(${(Math.random() * 2 - 1) * a}px, ${(Math.random() * 2 - 1) * a}px)`;
    } else if (cv.style.transform) cv.style.transform = '';

    if (state === 'rick') return drawRick(W, H);

    // overlays
    const my = pad + H * 0.36;
    const msg = state === 'ready' ? ['Snake Dodge', 'Press W A S D or tap to start']
      : state === 'paused' ? ['Paused', 'Press P or tap to continue']
      : state === 'hit' ? [hitMsg, 'Score reset'] : null;
    if (msg) {
      ctx.fillStyle = 'rgba(10,12,16,.62)';
      ctx.fillRect(pad, pad, W, H);
      ctx.textAlign = 'center'; ctx.fillStyle = state === 'hit' ? '#ff5a4e' : '#e9ecf1';
      ctx.font = `600 ${Math.max(18, cell * 1.2)}px system-ui, sans-serif`;
      ctx.fillText(msg[0], pad + W / 2, my - cell * 0.4);
      ctx.fillStyle = '#c3c9d4';
      ctx.font = `${Math.max(12, cell * 0.6)}px system-ui, sans-serif`;
      ctx.fillText(msg[1], pad + W / 2, my + cell * 0.8);
      if (state === 'ready') {
        ctx.fillStyle = '#ff5a4e';
        ctx.fillText(`Don't press the red key (${KEYS[forbidden]}): it makes you grow`, pad + W / 2, my + cell * 2);
      }
    }
  }

  const ease = t => 1 - Math.pow(1 - t, 3);
  const clamp01 = t => Math.max(0, Math.min(1, t));

  // An open cartoon hand seen from above, fingers pointing along +x, in units of one cell.
  function drawHand(spread) {
    ctx.translate(0.1, 0); // so the middle of the palm is what lands on the button
    ctx.fillStyle = '#9bf0ac'; ctx.strokeStyle = '#2c8a44'; ctx.lineWidth = 0.05; ctx.lineJoin = 'round';
    const fingers = [[-0.21, 0.30], [-0.07, 0.38], [0.07, 0.36], [0.21, 0.28]]; // [side offset, length]
    fingers.forEach(([y, len], i) => {
      ctx.save();
      ctx.translate(0.12, y);
      ctx.rotate((i - 1.5) * spread);
      ctx.beginPath(); ctx.roundRect(0, -0.06, len, 0.12, 0.06); ctx.fill(); ctx.stroke();
      ctx.restore();
    });
    // thumb
    ctx.save();
    ctx.translate(-0.08, 0.24); ctx.rotate(0.9 + spread);
    ctx.beginPath(); ctx.roundRect(0, -0.065, 0.3, 0.13, 0.065); ctx.fill(); ctx.stroke();
    ctx.restore();
    // palm
    ctx.beginPath(); ctx.roundRect(-0.36, -0.29, 0.52, 0.58, 0.16); ctx.fill(); ctx.stroke();
    // knuckle creases
    ctx.strokeStyle = 'rgba(44,138,68,.55)'; ctx.lineWidth = 0.035;
    for (const [y] of fingers) { ctx.beginPath(); ctx.moveTo(0.06, y - 0.04); ctx.lineTo(0.06, y + 0.04); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(-0.12, 0.02, 0.14, -1, 1); ctx.stroke();
  }

  function drawArm(cx, cy) {
    const t = armT, bx = rb.x * cell, by = rb.y * cell;
    // where the hand is over the ground, and how high it is lifted (0 = touching the button)
    const reach = ease(clamp01(t / T_REACH));
    let lift;
    if (t < T_REACH) lift = Math.sin(reach * Math.PI / 2) * 1.0;
    else if (t < T_WIND) lift = 1 + ease((t - T_REACH) / (T_WIND - T_REACH)) * 0.5;      // wind up higher
    else if (t < T_SLAM) lift = 1.5 * (1 - Math.pow((t - T_WIND) / (T_SLAM - T_WIND), 2)); // SLAM
    else lift = Math.abs(Math.sin((t - T_SLAM) * 18)) * 0.12 * Math.max(0, 1 - (t - T_SLAM) * 4); // small rebound
    const tremble = t > T_REACH && t < T_WIND ? (Math.random() - 0.5) * cell * 0.08 : 0;
    const gx = cx + (bx - cx) * reach, gy = cy + (by - cy) * reach;
    const hx = gx + tremble, hy = gy - lift * cell * 1.1 + tremble;   // lifted hands are drawn higher...
    const scale = cell * 2.3 * (1 + lift * 0.4);                       // ...and bigger, as if closer to you
    const ang = Math.atan2(by - cy, bx - cx);
    const slammed = t >= T_SLAM;

    // shadow on the ground: small and faint when the hand is high
    ctx.fillStyle = `rgba(0,0,0,${0.45 - lift * 0.2})`;
    ctx.beginPath(); ctx.ellipse(gx, gy, cell * (0.75 - lift * 0.25), cell * (0.55 - lift * 0.2), ang, 0, 7); ctx.fill();

    // arm: a thick bendy tube from the head to the wrist
    const wx = hx - Math.cos(ang) * scale * 0.2, wy = hy - Math.sin(ang) * scale * 0.2;
    const mx = (cx + wx) / 2, my = (cy + wy) / 2 - cell * (0.6 + lift * 0.8);
    ctx.lineCap = 'round';
    for (const [w, c] of [[0.5, '#2c8a44'], [0.38, '#5ee07a']]) {
      ctx.strokeStyle = c; ctx.lineWidth = cell * w * (1 + lift * 0.2);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.quadraticCurveTo(mx, my, wx, wy); ctx.stroke();
    }

    // the hand; fingers splay on impact, motion lines while slamming
    ctx.save();
    ctx.translate(hx, hy); ctx.rotate(ang); ctx.scale(scale, slammed && t - T_SLAM < 0.08 ? scale * 1.15 : scale);
    drawHand(slammed ? 0.22 : t < T_REACH ? 0.12 : 0.06);
    ctx.restore();
    if (t >= T_WIND && t < T_SLAM + 0.04) {
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = Math.max(2, cell * 0.08);
      for (const o of [-0.6, 0, 0.6]) {
        ctx.beginPath(); ctx.moveTo(hx + o * cell, hy - cell * 1.6); ctx.lineTo(hx + o * cell, hy - cell * 0.7); ctx.stroke();
      }
    }

    // impact effects
    const ti = t - T_SLAM;
    if (ti >= 0) {
      for (const [delay, speed] of [[0, 14], [0.06, 10]]) {          // shockwaves
        const k = ti - delay;
        if (k > 0 && k < 0.45) {
          ctx.strokeStyle = `rgba(255,255,255,${1 - k / 0.45})`; ctx.lineWidth = cell * 0.25 * (1 - k / 0.45) + 1;
          ctx.beginPath(); ctx.ellipse(bx, by, cell * (0.8 + k * speed), cell * (0.6 + k * speed * 0.75), 0, 0, 7); ctx.stroke();
        }
      }
      for (const p of sparks) {
        ctx.fillStyle = p.c;
        ctx.fillRect(p.x * cell - cell * 0.12, p.y * cell - cell * 0.12, cell * 0.24, cell * 0.24);
      }
      if (ti < 0.12) { ctx.fillStyle = `rgba(255,255,255,${0.6 * (1 - ti / 0.12)})`; ctx.fillRect(0, 0, COLS * cell, ROWS * cell); }
      // comic "SLAM!" burst
      const pop = Math.min(1, ti / 0.08) * (1 + Math.max(0, 0.25 - ti) * 1.2);
      const sx = Math.min(Math.max(bx, cell * 3), COLS * cell - cell * 3), sy = by > cell * 5.5 ? by - cell * 3.6 : by + cell * 3.6; // above the hand, or below near the top
      ctx.save();
      ctx.translate(sx, sy); ctx.rotate(-0.15); ctx.scale(pop, pop);
      ctx.beginPath();
      for (let i = 0; i < 24; i++) {
        const a = i / 24 * Math.PI * 2, rad = (i % 2 ? 1.2 : 1.9) * cell;
        ctx.lineTo(Math.cos(a) * rad * 1.35, Math.sin(a) * rad);
      }
      ctx.closePath();
      ctx.fillStyle = '#ffd23f'; ctx.fill();
      ctx.strokeStyle = '#b3261e'; ctx.lineWidth = cell * 0.12; ctx.stroke();
      ctx.fillStyle = '#d7261e'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `900 ${cell * 1.05}px system-ui, sans-serif`;
      ctx.fillText('SLAM!', 0, cell * 0.05);
      ctx.restore();
      ctx.textBaseline = 'alphabetic';
    }
  }

  function drawRick(W, H) {
    const t = rickT;
    ctx.save();
    ctx.translate(pad + W / 2, pad + H * 0.3);
    ctx.rotate(Math.sin(t * 5) * 0.12);
    const sc = 1 + Math.sin(t * 10) * 0.08; ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
    ctx.font = `800 ${Math.max(22, cell * 1.6)}px system-ui, sans-serif`;
    ctx.fillText('RICK ROLLED!', 0, 0);
    ctx.font = `600 ${Math.max(12, cell * 0.7)}px system-ui, sans-serif`;
    ctx.fillText('Survive on top of the video. Get hit to make it stop.', 0, cell * 1.2);
    ctx.restore();
  }


  function hud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    lenEl.textContent = snake.length + grow;
    const warn = state === 'playing' && swapTimer <= SWAP_WARN;
    for (const b of btns) {
      const k = +b.dataset.k;
      b.classList.toggle('forbidden', k === forbidden);
      b.classList.toggle('warn', warn && k === forbidden);
      b.querySelector('small').textContent = k === forbidden ? `+${GROW_PENALTY}` : '↑→↓←'[k];
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw(); hud();
    requestAnimationFrame(frame);
  }

  reset(); resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>

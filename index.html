<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snake Dodge</title>
<style>
  :root {
    --bg: #14161b; --panel: #1e2129; --ink: #e9ecf1; --mut: #8a93a3;
    --snake: #5ee07a; --head: #a6f5b5; --bad: #ff5a4e; --obst: #ffb838; --wall: #3a4050;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  /* The rickroll video sits behind the snake box, exactly inside its border (6px = pad in the script),
     and shows once the red button is pressed. It fills the box and is cropped at the edges if needed. */
  .board { position: relative; flex: none; }
  .board canvas { position: relative; z-index: 1; }
  .bgvid { position: absolute; inset: 6px; z-index: 0; overflow: hidden; pointer-events: none; container-type: size;
    opacity: 0; visibility: hidden; transition: opacity .6s; background: #000; }
  .bgvid iframe { position: absolute; top: 50%; left: 50%; border: 0;
    width: max(100cqw, 177.78cqh); height: max(100cqh, 56.25cqw); transform: translate(-50%, -50%); }
  body.rolling .bgvid { opacity: 1; visibility: visible; }
  .app { position: relative; z-index: 1; height: 100%; display: flex; align-items: center; justify-content: center; padding: 12px 16px; gap: 24px; }
  .side { width: 232px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .help { text-align: center; }
  .legend { font-size: 13px; color: var(--mut); display: grid; gap: 4px; }
  .legend b { color: var(--ink); font-weight: 600; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }
  .legend .trap { color: var(--bad); font-style: italic; padding-left: 16px; }
  @media (max-width: 760px) { .legend { display: none; } }
  @media (max-width: 760px) {
    .app { flex-direction: column; justify-content: flex-start; gap: 10px; }
    .side { display: contents; }
    .hud { order: -1; }
  }
  .hud { display: flex; gap: 22px; align-items: baseline; font-variant-numeric: tabular-nums; }
  .hud .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); }
  .hud b { font-size: 24px; display: block; }
  @keyframes blink { 50% { opacity: .2; } }
  canvas { display: block; border-radius: 6px; }
  .controls { display: grid; grid-template-columns: repeat(3, 72px); grid-template-rows: 46px 46px; gap: 6px; }
  .controls button { border-radius: 10px; border: 2px solid var(--wall); padding: 0;
    background: var(--panel); color: var(--ink); font: 700 20px/1 system-ui, sans-serif; cursor: pointer; }
  .controls button small { display: block; font-size: 10px; font-weight: 500; color: var(--mut); letter-spacing: .06em; margin-top: 3px; }
  .controls [data-k="0"] { grid-column: 2; grid-row: 1; }
  .controls [data-k="3"] { grid-column: 1; grid-row: 2; }
  .controls [data-k="2"] { grid-column: 2; grid-row: 2; }
  .controls [data-k="1"] { grid-column: 3; grid-row: 2; }
  .controls button.forbidden { background: var(--bad); border-color: #ff8a80; color: #fff;
    box-shadow: 0 0 18px rgba(255, 90, 78, .55); }
  .controls button.forbidden small { color: #fff; }
  .controls button:active { transform: translateY(1px); }
  /* a key that is switched off for a moment, without warning */
  .controls button.off { background: #0d0f13; border-color: #2a2e38; color: #4a5060; box-shadow: none;
    text-decoration: line-through; animation: none; }
  .controls button.off small { color: #6b7180; }
  .controls button.off.jolt { animation: jolt .25s; }
  @keyframes jolt { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .help { font-size: 12px; color: var(--mut); }
  a { color: var(--mut); }
</style>
</head>
<body>
<div class="app">
  <div class="board">
    <div class="bgvid" aria-hidden="true">
      <iframe id="rickvid" title="Background video" tabindex="-1" allow="autoplay; encrypted-media"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1&controls=0&disablekb=1&loop=1&playlist=dQw4w9WgXcQ&modestbranding=1&playsinline=1&rel=0&iv_load_policy=3"></iframe>
    </div>
    <canvas id="c"></canvas>
  </div>
  <div class="side">
  <div class="hud">
    <div><span class="k">Score</span><b id="score">0</b></div>
    <div><span class="k">Best</span><b id="best">0</b></div>
    <div><span class="k">Length</span><b id="len">0</b></div>
  </div>
  <div class="controls">
    <button data-k="0" aria-label="Up">W<small>↑</small></button>
    <button data-k="3" aria-label="Left">A<small>←</small></button>
    <button data-k="2" aria-label="Down">S<small>↓</small></button>
    <button data-k="1" aria-label="Right">D<small>→</small></button>
  </div>
  <div class="legend">
    <div><i style="background:#ff8a3d"></i><b>Bomb</b> clears all obstacles</div>
    <div><i style="background:#46d4ff"></i><b>Shield</b> makes you invincible</div>
    <div><i style="background:#c9a7ff"></i><b>Scissors</b> cut the snake in half</div>
    <div class="trap">…unless it's a trap</div>
  </div>
  <div class="help">W A S D or arrow keys to steer<br>P to pause · <a href="instructions.html">instructions</a></div>
  </div>
</div>
<script>
(() => {
  // ---- Tunables (we will iterate on these) ----
  const COLS = 36, ROWS = 24;
  const START_LEN = 4;
  // Pressing the red key gives a random punishment: grow, speed up or slow down.
  const GROW_PENALTY = 3;      // segments added
  const FAST_TIME = 3, SLOW_TIME = 3;  // seconds of extra speed / slowness
  const FAST_FACTOR = 0.55, SLOW_FACTOR = 1.9; // step time multipliers
  const MOVE_TIME = 0.14;      // seconds per snake step
  // The forbidden key comes and goes: a while with every key safe, then one key is red for a moment.
  const SAFE_TIME = () => 4 + Math.random() * 2;      // seconds with no forbidden key (about 5)
  const FORBID_TIME = () => 1.5 + Math.random() * 1;  // seconds one key is forbidden (about 2)
  const OFF_EVERY = () => 4 + Math.random() * 7; // seconds until a key is suddenly switched off
  const OFF_TIME = () => 0.9 + Math.random() * 0.5; // ...and for how long
  const RB_SPEED = 1.6;        // red button speed, cells/second (it homes in on the head)
  const RB_REACH = 3;        // how close the head must get before the arm presses it
  const RB_LIFE = 14;          // seconds before an unpressed red button fades away
  const RB_EVERY = () => 5 + Math.random() * 6; // seconds until the next red button
  // Arm timeline (seconds into the 'arm' state): reach out, wind up high, SLAM, then let the impact ring out.
  const T_REACH = 0.45, T_WIND = 0.75, T_SLAM = 0.83, ARM_TIME = 1.5;
  const RICK_TIME = 2;         // freeze with the banner before play resumes on top of the video
  const HIT_PAUSE = 1.2;       // freeze after a hit
  // Power-ups: bomb, shield, scissors. Some of them are traps.
  const PU_EVERY = () => 5 + Math.random() * 5; // seconds until the next power-up
  const PU_LIFE = 9, PU_MAX = 2;   // seconds one stays on the board; how many at once
  const TRAP_CHANCE = 0.2;         // chance a power-up backfires
  const SHIELD_TIME = 5, TURBO_TIME = 4, TRAP_GROW = 4;
  const PU_COLOR = { bomb: '#ff8a3d', shield: '#46d4ff', scissors: '#c9a7ff' };

  // Directions (also the key ids): 0 up/W, 1 right/D, 2 down/S, 3 left/A.
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best'), lenEl = $('len');
  const btns = [...document.querySelectorAll('.controls button')];

  let best = 0;
  try { best = +localStorage.getItem('snakeDodgeBest') || 0; } catch (e) {}

  let snake, dir, turns, grow, obstacles, score, state, moveAcc, spawnAcc, elapsed;
  let forbidden = -1, swapTimer = 0; // forbidden: the red key right now (-1 = none)
  // Each time a key turns red it gets ONE punishment, picked at random (never the same as last time):
  // 0 = grow, 1 = speed up, 2 = slow down. The red button shows which one.
  let effect = 0;
  const EFFECT_LABEL = [`+${GROW_PENALTY}`, 'FAST', 'SLOW'];
  let hitTimer = 0, penaltyFlash = 0, hitMsg = '';
  let items = [], puTimer = 0, shieldT = 0, turboT = 0, slowT = 0, bombFlash = 0;
  let fx = [], debris = [], popups = [], snip = null; // particles, cut-off tail pieces, floating texts, scissors animation
  let offKey = -1, offTimer = 0; // offKey: the key that is switched off right now (-1 = none)
  let rb = null, rbTimer = 0, armT = 0, rickT = 0, sparks = [];
  function toggleForbidden() {
    if (forbidden >= 0) { forbidden = -1; swapTimer = SAFE_TIME(); return; }
    do forbidden = Math.floor(Math.random() * 4); while (forbidden === offKey);
    effect = (effect + 1 + Math.floor(Math.random() * 2)) % 3; // a different effect than last time
    swapTimer = FORBID_TIME();
    beep(880, 0.12, 'triangle', 0.08);
  }

  function reset() {
    const y = Math.floor(ROWS * 0.65), x = Math.floor(COLS / 2) - 1;
    snake = [];
    for (let i = 0; i < START_LEN; i++) snake.push({ x: x - i + 1, y });
    dir = 1; turns = []; grow = 0; obstacles = [];
    score = 0; moveAcc = 0; spawnAcc = 0.6; elapsed = 0;
    forbidden = -1; swapTimer = SAFE_TIME(); // every key is safe at the start
    offKey = -1; offTimer = OFF_EVERY();
    rb = null; rbTimer = 3 + Math.random() * 3;
    items = []; puTimer = 2 + Math.random() * 3; shieldT = 0; turboT = 0; slowT = 0;
    debris = []; snip = null;
    state = 'ready';
  }

  // ---- Rickroll video (YouTube embed, driven by YouTube's iframe API) ----
  let rolling = false, player = null;
  const vid = document.getElementById('rickvid');
  window.onYouTubeIframeAPIReady = () => { player = new YT.Player('rickvid'); };
  const api = document.createElement('script');
  api.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(api);
  function startRoll() {
    rolling = true; document.body.classList.add('rolling');
    if (player && player.playVideo) {
      try {
        player.seekTo(0, true); player.unMute(); player.setVolume(80); player.playVideo();
        // browsers may refuse to start a video with sound: then play it muted
        setTimeout(() => {
          if (rolling && ![1, 3].includes(player.getPlayerState())) { player.mute(); player.playVideo(); }
        }, 1200);
      } catch (e) {}
    } else if (!vid.src.includes('autoplay=1')) vid.src += '&autoplay=1'; // API not loaded: autoplay the embed
  }
  function stopRoll() {
    if (!rolling) return;
    rolling = false; document.body.classList.remove('rolling');
    try { if (player && player.pauseVideo) player.pauseVideo(); else vid.src = vid.src.replace('&autoplay=1', ''); } catch (e) {}
  }

  // ---- Sound ----
  let actx = null;
  function beep(freq, dur = 0.08, type = 'square', vol = 0.06) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // A heavy slam: a low pitch drop plus a burst of noise.
  function thud() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.35);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.45);
      const len = Math.floor(actx.sampleRate * 0.25), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      const n = actx.createBufferSource(), f = actx.createBiquadFilter(), ng = actx.createGain();
      n.buffer = buf; f.type = 'lowpass'; f.frequency.value = 1400; ng.gain.value = 0.5;
      n.connect(f).connect(ng).connect(actx.destination); n.start(t);
    } catch (e) {}
  }

  // ---- Input ----
  function press(k) {
    if (state === 'ready' || state === 'paused') { state = 'playing'; return; }
    if (state !== 'playing') return;
    if (k === offKey) { // switched off: nothing happens, just a dead clunk
      beep(70, 0.07, 'square', 0.05);
      const b = btns.find(b => +b.dataset.k === k);
      b.classList.remove('jolt'); void b.offsetWidth; b.classList.add('jolt');
      return;
    }
    if (k === forbidden) {
      punish(); // it still steers, but you pay for it
    } else beep(520, 0.03, 'square', 0.03);
    const lastDir = turns.length ? turns[turns.length - 1] : dir;
    if (k !== lastDir && k !== (lastDir + 2) % 4 && turns.length < 2) turns.push(k);
  }
  function punish() {
    const h = snake[0], x = h.x + 0.5, y = h.y + 0.5, roll = effect;
    penaltyFlash = 0.35;
    if (roll === 0) {
      grow += GROW_PENALTY;
      beep(140, 0.18, 'sawtooth', 0.08);
      popup(x, y, `+${GROW_PENALTY} LENGTH`, '#ff5a4e');
    } else if (roll === 1) {
      turboT = FAST_TIME; slowT = 0;
      beep(300, 0.08, 'sawtooth', 0.07); setTimeout(() => beep(700, 0.12, 'sawtooth', 0.07), 70);
      popup(x, y, 'SPEED UP!', '#ff9f43');
    } else {
      slowT = SLOW_TIME; turboT = 0;
      beep(400, 0.12, 'sawtooth', 0.07); setTimeout(() => beep(150, 0.25, 'sawtooth', 0.07), 100);
      popup(x, y, 'SLOW DOWN!', '#7aa2ff');
    }
  }
  const KEYMAP = { w: 0, arrowup: 0, d: 1, arrowright: 1, s: 2, arrowdown: 2, a: 3, arrowleft: 3 };
  addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k in KEYMAP) { press(KEYMAP[k]); e.preventDefault(); }
    else if (k === 'p' || k === 'escape') { if (state === 'playing') state = 'paused'; else if (state === 'paused') state = 'playing'; }
    else if ((k === ' ' || k === 'enter') && (state === 'ready' || state === 'paused')) { state = 'playing'; e.preventDefault(); }
  });
  for (const b of btns) b.addEventListener('pointerdown', e => { e.preventDefault(); press(+b.dataset.k); });
  cv.addEventListener('pointerdown', e => {
    // tap on the board: steer toward the tap, relative to the head
    e.preventDefault();
    const r = cv.getBoundingClientRect(), h = snake[0];
    const dx = e.clientX - r.left - pad - (h.x + 0.5) * cell, dy = e.clientY - r.top - pad - (h.y + 0.5) * cell;
    press(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  });
  addEventListener('blur', () => { if (state === 'playing') state = 'paused'; });

  // ---- Game logic ----
  function hit(msg) {
    stopRoll(); // getting hit ends the rickroll
    hitMsg = msg; state = 'hit'; hitTimer = HIT_PAUSE;
    beep(90, 0.4, 'sawtooth', 0.1);
  }

  function step() {
    if (turns.length) dir = turns.shift();
    const h = snake[0];
    let nx = h.x + DIRS[dir][0], ny = h.y + DIRS[dir][1];
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
      if (shieldT <= 0) return hit('Hit the wall');
      nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS; // shielded: pass through to the other side
    }
    const body = grow > 0 ? snake : snake.slice(0, -1);
    if (shieldT <= 0 && body.some(s => s.x === nx && s.y === ny)) return hit('Bit yourself');
    snake.unshift({ x: nx, y: ny });
    if (grow > 0) grow--; else snake.pop();
    const it = items.find(i => i.x === nx && i.y === ny);
    if (it) pickup(it);
  }

  // ---- Power-ups ----
  function burst(x, y, n, colors, speed = 8) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.8), life = 0.35 + Math.random() * 0.45;
      fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, c: colors[i % colors.length] });
    }
  }
  function popup(x, y, text, c) { popups.push({ x, y, text, c, life: 1.2 }); }

  function spawnItem() {
    const types = ['bomb', 'shield', 'scissors'], h = snake[0];
    for (let tries = 0; tries < 60; tries++) {
      const x = 1 + Math.floor(Math.random() * (COLS - 2)), y = 1 + Math.floor(Math.random() * (ROWS - 2));
      if (Math.abs(x - h.x) + Math.abs(y - h.y) < 4) continue;
      if (snake.some(s => s.x === x && s.y === y) || items.some(i => i.x === x && i.y === y)) continue;
      items.push({ type: types[Math.floor(Math.random() * 3)], x, y, life: PU_LIFE, t: Math.random() * 6, trap: Math.random() < TRAP_CHANCE });
      return;
    }
  }

  function pickup(it) {
    items = items.filter(i => i !== it);
    const x = it.x + 0.5, y = it.y + 0.5;
    burst(x, y, 12, [PU_COLOR[it.type], '#fff'], 6);
    if (it.type === 'bomb') {
      if (!it.trap) {
        for (const o of obstacles) burst(o.x + o.w / 2, o.y + 0.5, 6 + o.w * 4, ['#ffb838', '#ff5a1f', '#fff', '#555'], 10);
        obstacles = []; bombFlash = 0.3; thud();
        popup(x, y, 'BOOM!', '#ffb838');
      } else { // dud: it calls in an obstacle rain instead
        for (let i = 0; i < 9; i++) {
          const w = 1 + Math.floor(Math.random() * 3);
          obstacles.push({ x: Math.floor(Math.random() * (COLS - w + 1)), y: -1 - Math.random() * 4, w, v: 4 + Math.random() * 3 });
        }
        beep(110, 0.35, 'sawtooth', 0.08);
        popup(x, y, 'DUD! INCOMING!', '#ff5a4e');
      }
    } else if (it.type === 'shield') {
      if (!it.trap) {
        shieldT = SHIELD_TIME; turboT = 0;
        beep(660, 0.08, 'triangle', 0.08); setTimeout(() => beep(990, 0.12, 'triangle', 0.08), 80);
        popup(x, y, 'SHIELD!', '#46d4ff');
      } else { // fake shield: the snake goes into turbo
        turboT = TURBO_TIME; slowT = 0;
        beep(300, 0.1, 'sawtooth', 0.07); setTimeout(() => beep(600, 0.15, 'sawtooth', 0.07), 90);
        popup(x, y, 'TRAP! TURBO!', '#ff5a4e');
      }
    } else if (it.type === 'scissors') {
      if (!it.trap) {
        const keep = Math.max(3, Math.ceil(snake.length / 2));
        grow = 0;
        if (snake.length > keep) {
          const a = snake[keep - 1], b = snake[keep];
          snip = { x: (a.x + b.x) / 2 + 0.5, y: (a.y + b.y) / 2 + 0.5, ang: Math.atan2(b.y - a.y, b.x - a.x) + Math.PI / 2, t: 0 };
          // the cut-off part tumbles away a moment later, when the blades close
          for (const sgm of snake.splice(keep)) debris.push({ x: sgm.x + 0.5, y: sgm.y + 0.5, vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3, rot: 0, vr: (Math.random() - 0.5) * 10, life: 1.2, delay: 0.25 });
        }
        beep(1800, 0.04, 'square', 0.05); setTimeout(() => beep(2200, 0.04, 'square', 0.05), 120);
        popup(x, y, 'SNIP!', '#c9a7ff');
      } else { // glued: the snake grows instead
        grow += TRAP_GROW; penaltyFlash = 0.5;
        beep(140, 0.25, 'sawtooth', 0.08);
        popup(x, y, `OOPS! GLUED +${TRAP_GROW}`, '#ff5a4e');
      }
    }
  }

  function updateEffects(dt) {
    for (const p of fx) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
    fx = fx.filter(p => p.life > 0);
    for (const d of debris) {
      if (d.delay > 0) { d.delay -= dt; continue; }
      d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt; d.life -= dt;
    }
    debris = debris.filter(d => d.life > 0);
    for (const p of popups) { p.y -= dt * 1.2; p.life -= dt; }
    popups = popups.filter(p => p.life > 0);
    if (snip && (snip.t += dt) > 0.6) snip = null;
    if (bombFlash > 0) bombFlash -= dt;
  }

  function difficulty() { return Math.min(1, elapsed / 90); }

  function spawn() {
    const d = difficulty();
    const w = 1 + Math.floor(Math.random() * (1 + d * 3));
    obstacles.push({
      x: Math.floor(Math.random() * (COLS - w + 1)), y: -1, w,
      v: 2.5 + d * 4 + Math.random() * 1.5,
    });
  }

  function overlapsSnake(o) {
    const m = 0.15; // a little forgiveness
    return snake.some(s => o.x + m < s.x + 1 && o.x + o.w - m > s.x && o.y + m < s.y + 1 && o.y + 1 - m > s.y);
  }

  // The red button drifts toward the head. Get close and the snake grows an arm and presses it.
  function updateRedButton(dt) {
    if (!rb) {
      if (rolling) return; // no new red button while the video plays
      rbTimer -= dt;
      if (rbTimer <= 0) rb = { x: 1 + Math.random() * (COLS - 2), y: -0.5, life: RB_LIFE };
      return;
    }
    const h = snake[0], hx = h.x + 0.5, hy = h.y + 0.5;
    const dx = hx - rb.x, dy = hy - rb.y, d = Math.hypot(dx, dy);
    if (d < RB_REACH) { state = 'arm'; armT = 0; beep(300, 0.1, 'triangle', 0.08); return; }
    rb.x += dx / d * RB_SPEED * dt; rb.y += dy / d * RB_SPEED * dt;
    rb.life -= dt;
    if (rb.life <= 0) { rb = null; rbTimer = RB_EVERY(); }
  }

  function impact() {
    thud();
    beep(1400, 0.05, 'square', 0.05);
    sparks = [];
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, v = 6 + Math.random() * 12;
      sparks.push({ x: rb.x, y: rb.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.3 + Math.random() * 0.4,
        c: ['#fff', '#ffd23f', '#ff3b30', '#ff8a3d'][i % 4] });
    }
  }

  function update(dt) {
    if (penaltyFlash > 0) penaltyFlash -= dt;
    if (state !== 'paused') updateEffects(dt);
    if (state === 'hit') {
      hitTimer -= dt;
      if (hitTimer <= 0) reset();
      return;
    }
    if (state === 'arm') {
      const before = armT;
      armT += dt;
      if (before < T_SLAM && armT >= T_SLAM) impact();
      for (const p of sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; p.life -= dt; }
      sparks = sparks.filter(p => p.life > 0);
      if (armT >= ARM_TIME) { state = 'rick'; rickT = 0; rb = null; sparks = []; rbTimer = RB_EVERY(); cv.style.transform = ''; startRoll(); }
      return;
    }
    if (state === 'rick') {
      rickT += dt;
      if (rickT >= RICK_TIME) { state = 'playing'; moveAcc = 0; }
      return;
    }
    if (state !== 'playing') return;

    elapsed += dt;
    swapTimer -= dt;
    offTimer -= dt;
    if (offTimer <= 0) {
      if (offKey < 0) { // out of nowhere: switch off a key that is not the forbidden one
        do offKey = Math.floor(Math.random() * 4); while (offKey === forbidden);
        offTimer = OFF_TIME();
      } else { offKey = -1; offTimer = OFF_EVERY(); }
    }
    if (swapTimer <= 0) toggleForbidden();

    if (shieldT > 0) shieldT -= dt;
    if (turboT > 0) turboT -= dt;
    if (slowT > 0) slowT -= dt;
    for (const it of items) { it.life -= dt; it.t += dt; }
    items = items.filter(it => it.life > 0);
    if ((puTimer -= dt) <= 0) { if (items.length < PU_MAX) spawnItem(); puTimer = PU_EVERY(); }

    const moveTime = MOVE_TIME * (turboT > 0 ? FAST_FACTOR : slowT > 0 ? SLOW_FACTOR : 1);
    moveAcc += dt;
    while (moveAcc >= moveTime && state === 'playing') { moveAcc -= moveTime; step(); }
    if (state !== 'playing') return;

    spawnAcc -= dt;
    if (spawnAcc <= 0) { spawn(); spawnAcc = (1.1 - difficulty() * 0.75 + Math.random() * 0.3) * 19 / COLS; }

    updateRedButton(dt);
    if (state !== 'playing') return;

    for (const o of obstacles) o.y += o.v * dt;
    for (const o of obstacles) if (overlapsSnake(o)) {
      if (shieldT <= 0) return hit('Hit by an obstacle');
      o.dead = true; // it shatters on the shield
      burst(o.x + o.w / 2, o.y + 0.5, 8 + o.w * 3, ['#ffb838', '#46d4ff', '#fff'], 9);
      beep(900, 0.05, 'square', 0.04);
    }
    obstacles = obstacles.filter(o => !o.dead);
    const before = obstacles.length;
    obstacles = obstacles.filter(o => o.y < ROWS);
    const dodged = before - obstacles.length;
    if (dodged) {
      score += dodged;
      if (score > best) { best = score; try { localStorage.setItem('snakeDodgeBest', best); } catch (e) {} }
    }
  }

  // ---- Rendering ----
  let cell = 20, pad = 6;
  function resize() {
    const stacked = innerWidth <= 760; // narrow screens put the controls under the board
    const availW = stacked ? innerWidth - 24 : innerWidth - 232 - 24 - 40, availH = stacked ? innerHeight - 220 : innerHeight - 24;
    cell = Math.max(10, Math.floor(Math.min(availW / COLS, availH / ROWS)));
    const w = COLS * cell + pad * 2, h = ROWS * cell + pad * 2, dpr = devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);

  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }

  function draw() {
    const W = COLS * cell, H = ROWS * cell;
    ctx.clearRect(0, 0, W + pad * 2, H + pad * 2);
    // border; while rickrolled the board is see-through so the video shows behind it
    ctx.fillStyle = state === 'hit' ? '#7a2620' : '#3a4050';
    rr(0, 0, W + pad * 2, H + pad * 2, 6);
    ctx.clearRect(pad, pad, W, H);
    ctx.fillStyle = rolling ? 'rgba(23,26,33,.35)' : '#171a21';
    ctx.fillRect(pad, pad, W, H);

    ctx.save();
    ctx.translate(pad, pad);
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

    // grid
    ctx.fillStyle = rolling ? 'rgba(255,255,255,.04)' : '#1d2129';
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) if ((x + y) % 2) ctx.fillRect(x * cell, y * cell, cell, cell);

    // obstacles
    for (const o of obstacles) {
      ctx.fillStyle = '#ffb838';
      rr(o.x * cell + 1, o.y * cell + 1, o.w * cell - 2, cell - 2, 3);
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.fillRect(o.x * cell + 3, o.y * cell + cell * 0.65, o.w * cell - 6, 2);
    }

    // power-ups
    for (const it of items) if (it.life > 2 || Math.floor(it.life * 8) % 2) drawItem(it);

    // red button
    if (rb) {
      const pressed = state === 'arm' && armT >= T_SLAM;
      const fade = Math.min(1, rb.life / 1.5), pulse = state === 'arm' ? 1 : 1 + Math.sin(performance.now() / 120) * 0.08;
      const bx = rb.x * cell, by = rb.y * cell, R = cell * 0.7 * pulse;
      ctx.globalAlpha = fade;
      ctx.fillStyle = 'rgba(255,60,50,.25)';
      ctx.beginPath(); ctx.arc(bx, by, R * 1.6, 0, 7); ctx.fill();
      ctx.fillStyle = '#2b2f38';
      ctx.beginPath(); ctx.arc(bx, by + cell * 0.12, R, 0, 7); ctx.fill();
      ctx.fillStyle = pressed ? '#a8201a' : '#ff3b30';
      ctx.beginPath();
      if (pressed) ctx.ellipse(bx, by + cell * 0.08, R * 0.85, R * 0.6, 0, 0, 7); // squashed flat
      else ctx.arc(bx, by - cell * 0.12, R * 0.75, 0, 7);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.beginPath(); ctx.arc(bx - R * 0.25, by - R * 0.35, R * 0.18, 0, 7); ctx.fill();
      // the "DON'T PRESS" sign hanging under it
      const fs = Math.max(9, cell * 0.42), ly = by + cell * 1.25;
      ctx.font = `800 ${fs}px system-ui, sans-serif`;
      const tw = ctx.measureText("DON'T PRESS").width + fs * 0.9;
      ctx.fillStyle = 'rgba(15,17,22,.9)'; ctx.strokeStyle = '#ff3b30'; ctx.lineWidth = Math.max(1.5, cell * 0.06);
      ctx.beginPath(); ctx.roundRect(bx - tw / 2, ly - fs * 0.8, tw, fs * 1.6, fs * 0.4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText("DON'T PRESS", bx, ly + fs * 0.05);
      ctx.textBaseline = 'alphabetic';
      ctx.globalAlpha = 1;
    }

    // cut-off tail pieces tumbling away
    for (const d of debris) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, d.life / 0.8);
      ctx.translate(d.x * cell, d.y * cell); ctx.rotate(d.rot); const k = 0.6 + 0.4 * Math.min(1, d.life / 1.2); ctx.scale(k, k);
      ctx.fillStyle = '#3fbf5c'; rr(-cell / 2 + 2, -cell / 2 + 2, cell - 4, cell - 4, cell * 0.25);
      ctx.restore();
    }

    // shield bubble around the whole snake (blinks when about to run out)
    if (shieldT > 0 && (shieldT > 1.2 || Math.floor(shieldT * 10) % 2)) {
      ctx.fillStyle = 'rgba(70,212,255,.28)';
      for (const s of snake) rr(s.x * cell - cell * 0.18, s.y * cell - cell * 0.18, cell * 1.36, cell * 1.36, cell * 0.5);
    }

    // snake
    const flash = penaltyFlash > 0 && Math.floor(penaltyFlash * 20) % 2 === 0;
    snake.forEach((s, i) => {
      const t = i / Math.max(1, snake.length - 1);
      ctx.fillStyle = flash || state === 'hit' ? '#ff5a4e' : i === 0 ? '#a6f5b5' : `hsl(135, 65%, ${58 - t * 22}%)`;
      const inset = i === 0 ? 1 : 2;
      rr(s.x * cell + inset, s.y * cell + inset, cell - inset * 2, cell - inset * 2, i === 0 ? cell * 0.35 : cell * 0.25);
    });
    // eyes
    const h = snake[0], [dx, dy] = DIRS[dir];
    const cx = h.x * cell + cell / 2, cy = h.y * cell + cell / 2;
    ctx.fillStyle = '#14161b';
    for (const sgn of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(cx + dx * cell * 0.18 + -dy * sgn * cell * 0.2, cy + dy * cell * 0.18 + dx * sgn * cell * 0.2, Math.max(1.5, cell * 0.08), 0, 7);
      ctx.fill();
    }
    if (turboT > 0) { // turbo speed lines behind the head
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
      for (const o of [-0.3, 0, 0.3]) {
        const l = cell * (0.8 + Math.random() * 0.8);
        ctx.beginPath();
        ctx.moveTo(cx - dx * cell * 0.7 - dy * o * cell, cy - dy * cell * 0.7 + dx * o * cell);
        ctx.lineTo(cx - dx * (cell * 0.7 + l) - dy * o * cell, cy - dy * (cell * 0.7 + l) + dx * o * cell);
        ctx.stroke();
      }
    }

    // scissors snipping the snake
    if (snip) {
      const open = 0.55 * Math.abs(Math.cos(snip.t / 0.6 * Math.PI * 2)); // snip, snip
      ctx.save();
      ctx.translate(snip.x * cell, snip.y * cell); ctx.rotate(snip.ang);
      const sc = cell * 3.2 * (1 + Math.max(0, 0.15 - snip.t) * 3); ctx.scale(sc, sc);
      ctx.translate(-0.3, 0); // so the blades meet on the cut
      drawScissors(open);
      ctx.restore();
      if (snip.t > 0.22 && snip.t < 0.4) { // the cut itself: a white slash across the snake
        ctx.save();
        ctx.translate(snip.x * cell, snip.y * cell); ctx.rotate(snip.ang);
        ctx.strokeStyle = `rgba(255,255,255,${1 - (snip.t - 0.22) / 0.18})`; ctx.lineWidth = Math.max(2, cell * 0.12);
        ctx.beginPath(); ctx.moveTo(-cell * 1.1, 0); ctx.lineTo(cell * 1.1, 0); ctx.stroke();
        ctx.restore();
      }
    }

    // particles and floating texts
    for (const p of fx) {
      ctx.globalAlpha = Math.min(1, p.life / p.max * 1.5);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x * cell - cell * 0.1, p.y * cell - cell * 0.1, cell * 0.2, cell * 0.2);
    }
    ctx.globalAlpha = 1;
    if (bombFlash > 0) { ctx.fillStyle = `rgba(255,200,120,${bombFlash * 1.6})`; ctx.fillRect(0, 0, W, H); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life / 0.4);
      ctx.font = `900 ${Math.max(14, cell * 0.85)}px system-ui, sans-serif`;
      ctx.lineWidth = Math.max(3, cell * 0.15); ctx.strokeStyle = '#111'; ctx.strokeText(p.text, p.x * cell, p.y * cell - cell);
      ctx.fillStyle = p.c; ctx.fillText(p.text, p.x * cell, p.y * cell - cell);
    }
    ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';

    // active effect timers in the corner
    const status = [];
    if (shieldT > 0) status.push(['SHIELD', shieldT, '#46d4ff']);
    if (turboT > 0) status.push(['TURBO', turboT, '#ff9f43']);
    if (slowT > 0) status.push(['SLOW', slowT, '#7aa2ff']);
    status.forEach(([name, t, c], i) => {
      const fs = Math.max(11, cell * 0.5), y = cell * 0.4 + i * fs * 1.9;
      ctx.font = `800 ${fs}px system-ui, sans-serif`; ctx.textAlign = 'left';
      const label = `${name} ${t.toFixed(1)}s`, w = ctx.measureText(label).width + fs;
      ctx.fillStyle = 'rgba(10,12,16,.75)'; ctx.beginPath(); ctx.roundRect(cell * 0.4, y, w, fs * 1.6, fs * 0.5); ctx.fill();
      ctx.fillStyle = c; ctx.textBaseline = 'middle'; ctx.fillText(label, cell * 0.4 + fs / 2, y + fs * 0.82);
      ctx.textBaseline = 'alphabetic';
    });

    // the arm and hand that slam the red button
    if (state === 'arm' && rb) drawArm(cx, cy);
    ctx.restore();

    // screen shake right after the slam
    const ti = state === 'arm' ? armT - T_SLAM : -1;
    if (ti >= 0 && ti < 0.45) {
      const a = cell * 0.5 * (1 - ti / 0.45);
      cv.style.transform = `translate(${(Math.random() * 2 - 1) * a}px, ${(Math.random() * 2 - 1) * a}px)`;
    } else if (cv.style.transform) cv.style.transform = '';

    if (state === 'rick') return drawRick(W, H);

    // overlays
    const my = pad + H * 0.36;
    const msg = state === 'ready' ? ['Snake Dodge', 'Press W A S D or tap to start']
      : state === 'paused' ? ['Paused', 'Press P or tap to continue']
      : state === 'hit' ? [hitMsg, 'Score reset'] : null;
    if (msg) {
      ctx.fillStyle = 'rgba(10,12,16,.62)';
      ctx.fillRect(pad, pad, W, H);
      ctx.textAlign = 'center'; ctx.fillStyle = state === 'hit' ? '#ff5a4e' : '#e9ecf1';
      ctx.font = `600 ${Math.max(18, cell * 1.2)}px system-ui, sans-serif`;
      ctx.fillText(msg[0], pad + W / 2, my - cell * 0.4);
      ctx.fillStyle = '#c3c9d4';
      ctx.font = `${Math.max(12, cell * 0.6)}px system-ui, sans-serif`;
      ctx.fillText(msg[1], pad + W / 2, my + cell * 0.8);
      if (state === 'ready') {
        ctx.fillStyle = '#ff5a4e';
        ctx.fillText(`Red key? Don't press it: you grow, speed up or slow down`, pad + W / 2, my + cell * 2);
      }
    }
  }

  // Power-up icons, drawn in units of one cell around (0, 0).
  function drawScissors(open) {
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (const sgn of [-1, 1]) {
      ctx.save();
      ctx.rotate(sgn * open);
      ctx.fillStyle = '#e6ebf2'; ctx.strokeStyle = '#4a5162'; ctx.lineWidth = 0.035;
      ctx.beginPath(); ctx.moveTo(-0.02, -0.045 * sgn); ctx.lineTo(0.42, 0); ctx.lineTo(-0.02, 0.035 * sgn); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#e0505a'; ctx.lineWidth = 0.06;
      ctx.beginPath(); ctx.moveTo(-0.02, 0); ctx.lineTo(-0.15, 0.05 * sgn); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(-0.24, 0.09 * sgn, 0.1, 0.075, 0.3 * sgn, 0, 7); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = '#4a5162'; ctx.beginPath(); ctx.arc(0, 0, 0.035, 0, 7); ctx.fill();
  }

  function drawItem(it) {
    const px = (it.x + 0.5) * cell, py = (it.y + 0.5) * cell + Math.sin(it.t * 4) * cell * 0.06;
    const glow = 0.25 + 0.1 * Math.sin(it.t * 6);
    ctx.save();
    ctx.translate(px, py);
    ctx.fillStyle = PU_COLOR[it.type]; ctx.globalAlpha = glow;
    ctx.beginPath(); ctx.arc(0, 0, cell * 0.85, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#10131a'; ctx.strokeStyle = PU_COLOR[it.type]; ctx.lineWidth = Math.max(1.5, cell * 0.07);
    ctx.beginPath(); ctx.arc(0, 0, cell * 0.62, 0, 7); ctx.fill(); ctx.stroke();
    ctx.scale(cell * 1.5, cell * 1.5);
    if (it.type === 'bomb') {
      ctx.fillStyle = '#2a2d35'; ctx.strokeStyle = '#000'; ctx.lineWidth = 0.03;
      ctx.beginPath(); ctx.arc(-0.03, 0.05, 0.25, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(-0.11, -0.03, 0.06, 0, 7); ctx.fill();
      ctx.fillStyle = '#555'; ctx.fillRect(0.06, -0.24, 0.1, 0.08);
      ctx.strokeStyle = '#c9a36b'; ctx.lineWidth = 0.035;
      ctx.beginPath(); ctx.moveTo(0.12, -0.24); ctx.quadraticCurveTo(0.17, -0.36, 0.25, -0.32); ctx.stroke();
      ctx.fillStyle = Math.floor(it.t * 12) % 2 ? '#ffd23f' : '#ff7a1a';
      ctx.beginPath(); ctx.arc(0.26, -0.33, 0.055 + 0.02 * Math.sin(it.t * 30), 0, 7); ctx.fill();
    } else if (it.type === 'shield') {
      ctx.fillStyle = '#46d4ff'; ctx.strokeStyle = '#0b6e8f'; ctx.lineWidth = 0.035;
      ctx.beginPath(); ctx.moveTo(0, -0.3); ctx.lineTo(0.24, -0.22); ctx.lineTo(0.22, 0.03);
      ctx.quadraticCurveTo(0.18, 0.22, 0, 0.32); ctx.quadraticCurveTo(-0.18, 0.22, -0.22, 0.03); ctx.lineTo(-0.24, -0.22);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.moveTo(0, -0.24); ctx.lineTo(0, 0.25); ctx.quadraticCurveTo(-0.14, 0.17, -0.17, 0.02); ctx.lineTo(-0.18, -0.18); ctx.closePath(); ctx.fill();
    } else {
      ctx.rotate(-0.6); ctx.translate(-0.09, 0); // centred in its circle
      drawScissors(0.3 + 0.2 * Math.abs(Math.sin(it.t * 3)));
    }
    ctx.restore();
  }

  const ease = t => 1 - Math.pow(1 - t, 3);
  const clamp01 = t => Math.max(0, Math.min(1, t));

  // An open cartoon hand seen from above, fingers pointing along +x, in units of one cell.
  function drawHand(spread) {
    ctx.translate(0.1, 0); // so the middle of the palm is what lands on the button
    ctx.fillStyle = '#9bf0ac'; ctx.strokeStyle = '#2c8a44'; ctx.lineWidth = 0.05; ctx.lineJoin = 'round';
    const fingers = [[-0.21, 0.30], [-0.07, 0.38], [0.07, 0.36], [0.21, 0.28]]; // [side offset, length]
    fingers.forEach(([y, len], i) => {
      ctx.save();
      ctx.translate(0.12, y);
      ctx.rotate((i - 1.5) * spread);
      ctx.beginPath(); ctx.roundRect(0, -0.06, len, 0.12, 0.06); ctx.fill(); ctx.stroke();
      ctx.restore();
    });
    // thumb
    ctx.save();
    ctx.translate(-0.08, 0.24); ctx.rotate(0.9 + spread);
    ctx.beginPath(); ctx.roundRect(0, -0.065, 0.3, 0.13, 0.065); ctx.fill(); ctx.stroke();
    ctx.restore();
    // palm
    ctx.beginPath(); ctx.roundRect(-0.36, -0.29, 0.52, 0.58, 0.16); ctx.fill(); ctx.stroke();
    // knuckle creases
    ctx.strokeStyle = 'rgba(44,138,68,.55)'; ctx.lineWidth = 0.035;
    for (const [y] of fingers) { ctx.beginPath(); ctx.moveTo(0.06, y - 0.04); ctx.lineTo(0.06, y + 0.04); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(-0.12, 0.02, 0.14, -1, 1); ctx.stroke();
  }

  function drawArm(cx, cy) {
    const t = armT, bx = rb.x * cell, by = rb.y * cell;
    // where the hand is over the ground, and how high it is lifted (0 = touching the button)
    const reach = ease(clamp01(t / T_REACH));
    let lift;
    if (t < T_REACH) lift = Math.sin(reach * Math.PI / 2) * 1.0;
    else if (t < T_WIND) lift = 1 + ease((t - T_REACH) / (T_WIND - T_REACH)) * 0.5;      // wind up higher
    else if (t < T_SLAM) lift = 1.5 * (1 - Math.pow((t - T_WIND) / (T_SLAM - T_WIND), 2)); // SLAM
    else lift = Math.abs(Math.sin((t - T_SLAM) * 18)) * 0.12 * Math.max(0, 1 - (t - T_SLAM) * 4); // small rebound
    const tremble = t > T_REACH && t < T_WIND ? (Math.random() - 0.5) * cell * 0.08 : 0;
    const gx = cx + (bx - cx) * reach, gy = cy + (by - cy) * reach;
    const hx = gx + tremble, hy = gy - lift * cell * 1.1 + tremble;   // lifted hands are drawn higher...
    const scale = cell * 2.3 * (1 + lift * 0.4);                       // ...and bigger, as if closer to you
    const ang = Math.atan2(by - cy, bx - cx);
    const slammed = t >= T_SLAM;

    // shadow on the ground: small and faint when the hand is high
    ctx.fillStyle = `rgba(0,0,0,${0.45 - lift * 0.2})`;
    ctx.beginPath(); ctx.ellipse(gx, gy, cell * (0.75 - lift * 0.25), cell * (0.55 - lift * 0.2), ang, 0, 7); ctx.fill();

    // arm: a thick bendy tube from the head to the wrist
    const wx = hx - Math.cos(ang) * scale * 0.2, wy = hy - Math.sin(ang) * scale * 0.2;
    const mx = (cx + wx) / 2, my = (cy + wy) / 2 - cell * (0.6 + lift * 0.8);
    ctx.lineCap = 'round';
    for (const [w, c] of [[0.5, '#2c8a44'], [0.38, '#5ee07a']]) {
      ctx.strokeStyle = c; ctx.lineWidth = cell * w * (1 + lift * 0.2);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.quadraticCurveTo(mx, my, wx, wy); ctx.stroke();
    }

    // the hand; fingers splay on impact, motion lines while slamming
    ctx.save();
    ctx.translate(hx, hy); ctx.rotate(ang); ctx.scale(scale, slammed && t - T_SLAM < 0.08 ? scale * 1.15 : scale);
    drawHand(slammed ? 0.22 : t < T_REACH ? 0.12 : 0.06);
    ctx.restore();
    if (t >= T_WIND && t < T_SLAM + 0.04) {
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = Math.max(2, cell * 0.08);
      for (const o of [-0.6, 0, 0.6]) {
        ctx.beginPath(); ctx.moveTo(hx + o * cell, hy - cell * 1.6); ctx.lineTo(hx + o * cell, hy - cell * 0.7); ctx.stroke();
      }
    }

    // impact effects
    const ti = t - T_SLAM;
    if (ti >= 0) {
      for (const [delay, speed] of [[0, 14], [0.06, 10]]) {          // shockwaves
        const k = ti - delay;
        if (k > 0 && k < 0.45) {
          ctx.strokeStyle = `rgba(255,255,255,${1 - k / 0.45})`; ctx.lineWidth = cell * 0.25 * (1 - k / 0.45) + 1;
          ctx.beginPath(); ctx.ellipse(bx, by, cell * (0.8 + k * speed), cell * (0.6 + k * speed * 0.75), 0, 0, 7); ctx.stroke();
        }
      }
      for (const p of sparks) {
        ctx.fillStyle = p.c;
        ctx.fillRect(p.x * cell - cell * 0.12, p.y * cell - cell * 0.12, cell * 0.24, cell * 0.24);
      }
      if (ti < 0.12) { ctx.fillStyle = `rgba(255,255,255,${0.6 * (1 - ti / 0.12)})`; ctx.fillRect(0, 0, COLS * cell, ROWS * cell); }
      // comic "SLAM!" burst
      const pop = Math.min(1, ti / 0.08) * (1 + Math.max(0, 0.25 - ti) * 1.2);
      const sx = Math.min(Math.max(bx, cell * 3), COLS * cell - cell * 3), sy = by > cell * 5.5 ? by - cell * 3.6 : by + cell * 3.6; // above the hand, or below near the top
      ctx.save();
      ctx.translate(sx, sy); ctx.rotate(-0.15); ctx.scale(pop, pop);
      ctx.beginPath();
      for (let i = 0; i < 24; i++) {
        const a = i / 24 * Math.PI * 2, rad = (i % 2 ? 1.2 : 1.9) * cell;
        ctx.lineTo(Math.cos(a) * rad * 1.35, Math.sin(a) * rad);
      }
      ctx.closePath();
      ctx.fillStyle = '#ffd23f'; ctx.fill();
      ctx.strokeStyle = '#b3261e'; ctx.lineWidth = cell * 0.12; ctx.stroke();
      ctx.fillStyle = '#d7261e'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `900 ${cell * 1.05}px system-ui, sans-serif`;
      ctx.fillText('SLAM!', 0, cell * 0.05);
      ctx.restore();
      ctx.textBaseline = 'alphabetic';
    }
  }

  function drawRick(W, H) {
    const t = rickT;
    ctx.save();
    ctx.translate(pad + W / 2, pad + H * 0.3);
    ctx.rotate(Math.sin(t * 5) * 0.12);
    const sc = 1 + Math.sin(t * 10) * 0.08; ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
    ctx.font = `800 ${Math.max(22, cell * 1.6)}px system-ui, sans-serif`;
    ctx.fillText('RICK ROLLED!', 0, 0);
    ctx.font = `600 ${Math.max(12, cell * 0.7)}px system-ui, sans-serif`;
    ctx.fillText('Survive on top of the video. Get hit to make it stop.', 0, cell * 1.2);
    ctx.restore();
  }


  function hud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    lenEl.textContent = snake.length + grow;
    for (const b of btns) {
      const k = +b.dataset.k;
      b.classList.toggle('forbidden', k === forbidden);
      b.classList.toggle('off', k === offKey);
      b.querySelector('small').textContent = k === offKey ? 'OFF' : k === forbidden ? EFFECT_LABEL[effect] : '↑→↓←'[k];
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw(); hud();
    requestAnimationFrame(frame);
  }

  reset(); resize(); requestAnimationFrame(frame);
})();
</script>
